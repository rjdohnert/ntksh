; ==============================================================================
; ntksh Configuration File (ksh.ini)
; Automatically loaded on startup from %USERPROFILE%\ksh.ini
; ==============================================================================

[prompt]
; Shell prompt customization. Default is "$ " (or "# " for Administrator).
; Supported escape tokens:
;   \u - Username
;   \h - Hostname
;   \w - Full current working directory
;   \W - Basename of current working directory
;   \$ - '$' (or '#' if running as Administrator)
prompt = "$ "

[aliases]
; Common command aliases
ll = ls -la
la = ls -A
l = ls -CF
cls = clear

[env]
; Environment variables exported on startup
; EDITOR = notepad
